<script>
  function setPageMeta() {
    const path = window.location.pathname;
    const segments = path.split('/').filter(Boolean);

    // --- Robots Tag Fix (Indexable) ---
    let robots = document.querySelector('meta[name="robots"]');
    if (!robots) {
      robots = document.createElement('meta');
      robots.name = "robots";
      document.head.appendChild(robots);
    }
    robots.setAttribute('content', 'index, follow');

    if (segments.length >= 4 && segments[1] === 'vendor') {
      const vendorNameEl = document.querySelector('.vendor-name');
      const vendorTypeEl = document.querySelector('.vendor-type');

      if (vendorNameEl && vendorNameEl.innerText.trim() !== "") {
        let vName = vendorNameEl.innerText.trim();
        let vType = vendorTypeEl ? vendorTypeEl.innerText.trim() : "Logistics Company";

        // Title: Contact {vendor name}, a {vendor type} in Nigeria
        document.title = `Contact ${vName}, a ${vType} in Nigeria | Travo.ng`;
        
        let desc = document.querySelector('meta[name="description"]');
        if (desc) {
          // Description: Find contact details for {vendor name}, a {vendor type} in Nigeria
          desc.setAttribute('content', `Find contact details for ${vName}, a ${vType} in Nigeria. Book now and connect with verified logistics on Travo.ng.`);
        }
        updateCanonical(`https://travo.ng${path}`);
        return; // Next checks skip karein
      }
    }

    if (path.includes('/directory/vendor/') && segments.length === 3) {
      let typeRaw = path.split('/directory/vendor/')[1] || "";
      typeRaw = typeRaw.split('/')[0]; 
      let type = decodeURIComponent(typeRaw).replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      
      if (type) {
        // Meta title formula: Find a {vendor type} online in Nigeria with Travo.ng
        document.title = `Find a ${type} online in Nigeria with Travo.ng`;
        
        let desc = document.querySelector('meta[name="description"]');
        if (desc) {
          // Meta description formula: Book a {vendor type} quickly and easily online in Nigeria
          desc.setAttribute('content', `Book a ${type} quickly and easily online in Nigeria.`);
        }
        updateCanonical(`https://travo.ng${path}`);
      }
    }

    // 1. PLACE DETAILS PAGE
    if (segments.length >= 4 && segments[1] === 'place') {
      const nameEl = document.querySelector('.place-name');
      const addrEl = document.querySelector('.place-address');

      if (nameEl && nameEl.innerText.trim() !== "") {
        let placeName = nameEl.innerText.trim();
        let placeAddress = addrEl ? addrEl.innerText.trim() : "Nigeria";
        let placeTypeRaw = segments[2] || "Logistics";
        let placeType = decodeURIComponent(placeTypeRaw).replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());

        document.title = `Find ${placeName}, ${placeType} in Nigeria | Travo.ng`;
        let desc = document.querySelector('meta[name="description"]');
        if (desc) {
          // Aapka bataya hua exact formula
          desc.setAttribute('content', `Contact ${placeName} a ${placeType} in Nigeria - ${placeAddress} - Book Now on Travo.ng`);
        }
        updateCanonical(`https://travo.ng${path}`);
      }
    }

    // 2. CATEGORY LIST PAGE
    else if (path.includes('/directory/place/')) {
      let typeRaw = path.split('/directory/place/')[1] || "";
      typeRaw = typeRaw.split('/')[0]; 
      let type = decodeURIComponent(typeRaw).replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      if (type) {
        document.title = `Search our directory of ${type} locations in Nigeria on Travo.ng`;
        let desc = document.querySelector('meta[name="description"]');
        if (desc) {
          // Aapka bataya hua exact formula
          desc.setAttribute('content', `Browse a full Directory of ${type} locations in Nigeria, Ghana, Kenya and Africa with Travo.ng - Book your transport today`);
        }
        updateCanonical(`https://travo.ng${path}`);
      }
    }

    // 3. MAIN DIRECTORY PAGE
    else if (path === '/directory' || path === '/directory/') {
      document.title = 'Nigeria Logistics & Transport Directory | Verified Haulage & Delivery Services – Travo.ng';
      let desc = document.querySelector('meta[name="description"]');
      if (desc) {
        // Aapka bataya hua exact content
        desc.setAttribute('content', 'Find verified logistics, transport, haulage, and delivery companies across Nigeria on Travo.ng. Search by city or category to connect with trusted, human-verified service providers.');
      }
      updateCanonical('https://travo.ng/directory');
    }

    // 4. VENDOR SIGNUP PAGE
    else if (path === '/vendor-signup') {
      document.title = 'Register Your Delivery Business | Find Logistics Jobs – travo.ng';
      let desc = document.querySelector('meta[name="description"]');
      if (desc) {
        desc.setAttribute('content', 'Sign up your transport or delivery business on travo.ng...');
      }
      updateCanonical('https://travo.ng/vendor-signup');
    }

    if (path === '/auth' || path.includes('/auth')) {
        document.title = 'Travo.ng – Parcel Delivery, Travel Booking & Logistics Services in Nigeria';
        
        let desc = document.querySelector('meta[name="description"]');
        if (!desc) {
            desc = document.createElement('meta');
            desc.name = "description";
            document.head.appendChild(desc);
        }
        // Descriptive content taaki tool 183 characters wala error na de
        desc.setAttribute('content', 'Travo.ng offers fast parcel delivery, travel bookings, haulage, driver hire, food delivery, and container import/export services across Nigeria. Your trusted all-in-one logistics solution.');
        updateCanonical('https://travo.ng/auth');
        return;
    }

    // Privacy Policy page
    if (path === '/privacy-policy') {
        document.title = 'Travo.ng Privacy Policy | Data Protection, Shipping & Logistics Privacy';
        let desc = document.querySelector('meta[name="description"]');
        if (!desc) {
            desc = document.createElement('meta');
            desc.name = "description";
            document.head.appendChild(desc);
        }
        desc.setAttribute('content', 'Read the Travo.ng Privacy Policy to understand how we collect, use, protect, and process personal information for logistics, transportation, delivery, and international shipping services across Nigeria and globally.');
        updateCanonical('https://travo.ng/privacy-policy');
        return;
    }

    // Terms and Conditions page
    if (path === '/terms-and-conditions') {
        document.title = 'Travo.ng Terms and Conditions | Logistics, Delivery & Shipping Services';
        let desc = document.querySelector('meta[name="description"]');
        if (!desc) {
            desc = document.createElement('meta');
            desc.name = "description";
            document.head.appendChild(desc);
        }
        desc.setAttribute('content', 'Read the Travo.ng Terms and Conditions governing the use of our logistics, transportation, delivery, courier, and international shipping services across Nigeria and worldwide.');
        updateCanonical('https://travo.ng/terms-and-conditions');
        return;
    }
    
  }

  function updateCanonical(url) {
    let canonical = document.querySelector('link[rel="canonical"]');
    if (!canonical) {
      canonical = document.createElement('link');
      canonical.rel = 'canonical';
      document.head.appendChild(canonical);
    }
    canonical.href = url;
  }
  document.addEventListener("DOMContentLoaded", function () {
    setPageMeta();
    // Body load hone ke baad hi observer start hoga (Error fix)
    if (document.body) {
      const observer = new MutationObserver(() => {
        setPageMeta();
      });
      observer.observe(document.body, { subtree: true, childList: true, characterData: true });
    }

    setTimeout(setPageMeta, 1500);
    setTimeout(setPageMeta, 3000);
  });

  let lastPath = window.location.pathname;
  setInterval(() => {
    if (window.location.pathname !== lastPath) {
      lastPath = window.location.pathname;
      setTimeout(setPageMeta, 500);
    }
  }, 500);
</script>

  <div id="app-loading-screen" style="
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
  ">
      <img src="/images/Travo-logo.png" style="width: 160px; margin-bottom: 24px;" />
      
      <div style="
          width: 40px; height: 40px;
          border: 3px solid rgba(255,255,255,0.2);
          border-top-color: #38bdf8;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
          margin-bottom: 24px;
      "></div>
      
      <p style="color:#94a3b8; font-size:14px; margin-bottom: 16px;">Loading Travo...</p>

      <div id="reload-btn-wrapper" style="display:none; text-align:center;">
          <p style="color:#94a3b8; margin-bottom:12px; font-size:14px;">Taking too long?</p>
          <button onclick="window.location.reload()" style="
              background: #38bdf8;
              color: white;
              border: none;
              padding: 10px 24px;
              border-radius: 8px;
              font-size: 14px;
              cursor: pointer;
          ">Reload Page</button>
      </div>
  </div>

  <style>
      @keyframes spin {
          to { transform: rotate(360deg); }
      }
  </style>

  <script>
      // 8 sec baad reload button show karo
      setTimeout(function() {
          var btn = document.getElementById('reload-btn-wrapper');
          if (btn) btn.style.display = 'block';
      }, 8000);

      // Ember load hone pe loading screen hide karo
      document.addEventListener('DOMContentLoaded', function() {
          var checkInterval = setInterval(function() {
              var emberApp = document.querySelector('.next-view-container, .ember-view, #next-view-section');
              if (emberApp) {
                  clearInterval(checkInterval);
                  var screen = document.getElementById('app-loading-screen');
                  if (screen) {
                      screen.style.opacity = '0';
                      screen.style.transition = 'opacity 0.5s';
                      setTimeout(function() {
                          screen.style.display = 'none';
                      }, 500);
                  }
              }
          }, 300);
      });
  </script>
